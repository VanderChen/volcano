apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill-0
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefill-0
  template:
    metadata:
      labels:
        app: prefill-0
        role: prefill
        shard: p0
      annotations:
        scheduling.k8s.io/group-name: pg-myq
    spec:
      schedulerName: volcano
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 500m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 200Mi
---
