apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: test
spec:
  minAvailable: 4
  queue: default
  schedulerName: volcano
  networkTopology:
    mode: soft
    highestTierAllowed: 2
  tasks:
    - name: ps
      replicas: 4
      minAvailable: 4
      partitionPolicy:
        totalPartitions: 2
        minPartitions: 2
        partitionSize: 2
        networkTopology:
          mode: soft
          highestTierAllowed: 1
      template:
        metadata:
          labels:
            app: hypernode-soft-affinity-008
        spec:
          restartPolicy: Never
          containers:
            - name: pause
              image: busybox:1.36.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - sleep 3600
              resources:
                requests:
                  cpu: "5"
                  memory: 128Mi
                limits:
                  cpu: "5"
                  memory: 128Mi
