actions: "enqueue, allocate, backfill, preempt"
tiers:
- plugins:
  - name: priority
  - name: gang
    enableJobStarving: false
    enablePreemptable: false
    enableReclaimable: false
  - name: conformance
  - name: capacity
    enableHierarchy: true
  - name: network-topology-aware
    enabledHyperNodeGradient: true
    enabledHyperNodeOrder: true
    arguments:
      weight: 10
      hypernode.binpack.cpu: 0
      hypernode.binpack.memory: 0
      hypernode.binpack.resources: example.com/gpu
      hypernode.binpack.resources.example.com/gpu: 1
  - name: group-topology-affinity
    enabledHyperNodeGradient: true
    enabledHyperNodeOrder: true
    arguments:
      weight: 10
- plugins:
  - name: drf
    enablePreemptable: false
    enableReclaimable: false
  - name: predicates
  - name: nodeorder
