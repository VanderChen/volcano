apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Pod
  metadata:
    name: bug009-prefill-0
    namespace: default
    labels:
      bug009.volcano.sh/role: target
      volcano.sh/role: prefill
      volcano.sh/shard-id: "0"
    annotations:
      scheduling.k8s.io/group-name: bug009-target
  spec:
    schedulerName: volcano
    restartPolicy: Never
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              bug009.volcano.sh/role: target
          topologyKey: kubernetes.io/hostname
    containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
