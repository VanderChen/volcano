# Strict reconstruction of the rules explicitly provided in the report.
# It intentionally does not add Job/SubGroup networkTopology fields.
apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: pg-myq-010
  namespace: default
spec:
  minMember: 4
  queue: default
  subGroupPolicy:
  - name: prefill
    labelSelector:
      matchLabels:
        volcano.sh/role: prefill
    matchLabelKeys:
    - volcano.sh/shard-id
    minSubGroups: 2
    subGroupSize: 1
  - name: decode
    labelSelector:
      matchLabels:
        volcano.sh/role: decode
    matchLabelKeys:
    - volcano.sh/shard-id
    minSubGroups: 2
    subGroupSize: 1
  topologyAffinity:
    subGroupAntiAffinity:
      preferred:
      - subGroups: [prefill]
        weight: 100
        topologyTierName: volcano.sh/hypernode
      - subGroups: [decode]
        weight: 100
        topologyTierName: volcano.sh/hypernode
    subGroupAffinity:
      preferred:
      - subGroups: [prefill, decode]
        weight: 100
        topologyTierName: volcano.sh/hyperinstance-group
