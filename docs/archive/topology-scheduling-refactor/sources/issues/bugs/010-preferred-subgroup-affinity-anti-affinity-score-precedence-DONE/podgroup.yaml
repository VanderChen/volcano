apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: pg-myq-010
  namespace: default
spec:
  minMember: 4
  queue: default
  # The soft envelope is needed to expose the reported score-precedence case:
  # both the compact and split layouts remain within one hyperinstance group.
  networkTopology:
    mode: soft
    highestTierName: volcano.sh/hyperinstance-group
  subGroupPolicy:
  - name: prefill
    labelSelector:
      matchLabels:
        volcano.sh/role: prefill
    matchLabelKeys:
    - volcano.sh/shard-id
    minSubGroups: 2
    subGroupSize: 1
    networkTopology:
      mode: soft
      highestTierName: volcano.sh/hypernode
  - name: decode
    labelSelector:
      matchLabels:
        volcano.sh/role: decode
    matchLabelKeys:
    - volcano.sh/shard-id
    minSubGroups: 2
    subGroupSize: 1
    networkTopology:
      mode: soft
      highestTierName: volcano.sh/hypernode
  topologyAffinity:
    subGroupAntiAffinity:
      preferred:
      - subGroups: [prefill]
        weight: 100
        topologyTierName: volcano.sh/hypernode
      - subGroups: [decode]
        weight: 100
        topologyTierName: volcano.sh/hypernode
    subGroupAffinity:
      preferred:
      - subGroups: [prefill, decode]
        weight: 100
        topologyTierName: volcano.sh/hyperinstance-group
