  namespace: default
  labels:
    topology.volcano.sh/group: candidate-forest-memory
spec:
  minMember: 1
  minResources:
    cpu: "30"
  queue: default
  topologyAffinity:
    podGroupAntiAffinity:
      required:
      - podGroupSelector: {}
        topologyTierName: volcano.sh/hyperinstance-group
