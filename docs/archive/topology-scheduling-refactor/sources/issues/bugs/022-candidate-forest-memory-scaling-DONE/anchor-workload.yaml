apiVersion: v1
kind: Pod
metadata:
  name: bug022-anchor
  namespace: default
  labels:
    bug022.volcano.sh/role: anchor
  annotations:
    scheduling.k8s.io/group-name: bug022-anchor
spec:
  schedulerName: volcano
  nodeSelector:
    kubernetes.io/hostname: volcano-dev-022-worker
  restartPolicy: Never
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
