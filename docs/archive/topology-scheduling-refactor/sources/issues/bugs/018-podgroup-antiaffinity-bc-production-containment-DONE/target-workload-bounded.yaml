apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Pod
  metadata:
    name: bug018-prefill-0
    namespace: default
    labels:
      bug018.volcano.sh/role: target
      volcano.sh/role: prefill
      volcano.sh/shard-id: "0"
    annotations:
      scheduling.k8s.io/group-name: bug018-target
  spec:
    schedulerName: volcano
    restartPolicy: Never
    containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 4500m
          memory: 16Mi
