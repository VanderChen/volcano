apiVersion: v1
kind: Pod
metadata:
  name: filler-hn-a
  namespace: default
  labels:
    app: soft-fallback-filler
spec:
  nodeName: volcano-dev-012-worker
  containers:
  - name: nginx
    image: nginx:1.27-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 11500m
        memory: 50Mi
      limits:
        cpu: 11500m
        memory: 50Mi
