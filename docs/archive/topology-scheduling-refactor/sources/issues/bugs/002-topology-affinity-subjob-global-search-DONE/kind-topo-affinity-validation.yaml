apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: topo-affinity-hard-zero-min
  namespace: default
spec:
  queue: default
  minMember: 0
  subGroupPolicy:
  - name: role-a
    labelSelector:
      matchLabels:
        topo-affinity-test: hard
        role: a
    matchLabelKeys:
    - shard
    subGroupSize: 1
    minSubGroups: 0
  - name: role-b
    labelSelector:
      matchLabels:
        topo-affinity-test: hard
        role: b
    matchLabelKeys:
    - shard
    subGroupSize: 1
    minSubGroups: 0
  topologyAffinity:
    subGroupAffinity:
      required:
      - subGroups:
        - role-a
        - role-b
        topologyTierName: tier2
---
apiVersion: v1
kind: Pod
metadata:
  name: topo-affinity-hard-a
  namespace: default
  labels:
    topo-affinity-test: hard
    role: a
    shard: "0"
  annotations:
    scheduling.k8s.io/group-name: topo-affinity-hard-zero-min
spec:
  schedulerName: volcano
  restartPolicy: Never
  nodeSelector:
    topo-affinity-test/role-a: "true"
  containers:
  - name: worker
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - sleep 360000
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: topo-affinity-hard-b
  namespace: default
  labels:
    topo-affinity-test: hard
    role: b
    shard: "0"
  annotations:
    scheduling.k8s.io/group-name: topo-affinity-hard-zero-min
spec:
  schedulerName: volcano
  restartPolicy: Never
  nodeSelector:
    topo-affinity-test/role-b: "true"
  containers:
  - name: worker
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - sleep 360000
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: topo-affinity-preferred-after-ready
  namespace: default
spec:
  queue: default
  minMember: 1
  subGroupPolicy:
  - name: role-a
    labelSelector:
      matchLabels:
        topo-affinity-test: preferred
        role: a
    matchLabelKeys:
    - shard
    subGroupSize: 1
    minSubGroups: 0
  - name: role-b
    labelSelector:
      matchLabels:
        topo-affinity-test: preferred
        role: b
    matchLabelKeys:
    - shard
    subGroupSize: 1
    minSubGroups: 0
  topologyAffinity:
    subGroupAffinity:
      preferred:
      - subGroups:
        - role-a
        - role-b
        weight: 100
        topologyTierName: tier2
---
