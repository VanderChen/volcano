apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug019-prefill-0
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bug019-prefill-0
  template:
    metadata:
      labels:
        app: bug019-prefill-0
        role: prefill
        shard: "0"
      annotations:
        scheduling.k8s.io/group-name: bug019-preferred
    spec:
      schedulerName: volcano
      containers:
      - name: sleeper
        image: volcanosh/vc-scheduler:dev-019-k0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "sleep 3600"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
