apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: bug019-preferred
  namespace: default
spec:
  minMember: 4
  queue: default
  subGroupPolicy:
  - name: prefill
    labelSelector:
      matchLabels:
        role: prefill
    matchLabelKeys:
    - shard
    subGroupSize: 1
    minSubGroups: 2
  - name: decode
    labelSelector:
      matchLabels:
        role: decode
    matchLabelKeys:
    - shard
    subGroupSize: 1
    minSubGroups: 2
  topologyAffinity:
    subGroupAffinity:
      preferred:
      - subGroups:
        - prefill
        - decode
        topologyTierName: volcano.sh/hyperinstance-group
        weight: 100
    subGroupAntiAffinity:
      preferred:
      - subGroups:
        - prefill
        topologyTierName: volcano.sh/hypernode
        weight: 100
      - subGroups:
        - decode
        topologyTierName: volcano.sh/hypernode
        weight: 100
