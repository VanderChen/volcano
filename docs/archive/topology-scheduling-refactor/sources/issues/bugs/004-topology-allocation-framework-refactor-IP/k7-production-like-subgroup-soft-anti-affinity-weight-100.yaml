# K7 score-sensitivity variant. It is identical to the soft reproduction
# except that the sole preferred SubGroup anti-affinity term has weight 100.
apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: bug004-k7-soft-weight-100
  namespace: default
spec:
  minMember: 2
  queue: default
  networkTopology:
    highestTierName: tier3
    mode: soft
  subGroupPolicy:
  - name: role-0
    labelSelector:
      matchLabels:
        app.modelarts.huaweicloud/role: role-0
    matchLabelKeys:
    - app.modelarts.huaweicloud/role-0-group
    minSubGroups: 2
    subGroupSize: 1
    networkTopology:
      highestTierName: tier1
      mode: soft
  topologyAffinity:
    subGroupAntiAffinity:
      preferred:
      - subGroups:
        - role-0
        topologyTierName: tier1
        weight: 100
