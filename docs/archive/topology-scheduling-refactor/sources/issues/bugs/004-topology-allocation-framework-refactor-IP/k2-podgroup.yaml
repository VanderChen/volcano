apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: bug004-k2-incremental-soft
  namespace: default
spec:
  queue: default
  minMember: 1
  networkTopology:
    mode: soft
    highestTierName: tier2
  subGroupPolicy:
  - name: worker
    labelSelector:
      matchLabels:
        bug004-case: k2
    matchLabelKeys:
    - shard
    subGroupSize: 1
    minSubGroups: 0
    networkTopology:
      mode: soft
      highestTierName: tier1
  topologyAffinity:
    subGroupAffinity:
      preferred:
      - subGroups:
        - worker
        topologyTierName: tier2
        weight: 100
