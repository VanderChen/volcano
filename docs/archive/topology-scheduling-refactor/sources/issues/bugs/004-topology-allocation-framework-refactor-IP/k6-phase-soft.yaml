apiVersion: apps/v1
kind: Deployment
metadata: {name: bug004-k6-soft, namespace: default}
spec:
  replicas: 1
  selector:
    matchLabels: {app: bug004-k6-soft}
  template:
    metadata:
      labels: {app: bug004-k6-soft, bug004-case: k6, role: soft, shard: "0"}
      annotations: {scheduling.k8s.io/group-name: bug004-k6-mixed}
    spec:
      schedulerName: volcano
      nodeSelector: {topology.volcano.sh/tier2: kind-pair-a}
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests: {cpu: 100m, memory: 64Mi}
