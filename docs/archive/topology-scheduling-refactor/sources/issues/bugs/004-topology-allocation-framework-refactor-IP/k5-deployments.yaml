apiVersion: apps/v1
kind: Deployment
metadata: {name: bug004-k5-hard-a, namespace: default}
spec:
  replicas: 1
  selector:
    matchLabels: {app: bug004-k5-hard-a}
  template:
    metadata:
      labels: {app: bug004-k5-hard-a, bug004-case: k5-hard, role: a, shard: "0"}
      annotations: {scheduling.k8s.io/group-name: bug004-k5-hard-zero}
    spec:
      schedulerName: volcano
      nodeSelector: {bug004/k5-a: "true"}
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests: {cpu: 100m, memory: 64Mi}
---
