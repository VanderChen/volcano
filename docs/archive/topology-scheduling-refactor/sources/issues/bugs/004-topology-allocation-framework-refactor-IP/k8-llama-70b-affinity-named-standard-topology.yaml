# Test-only names for the existing four-node standard tree.  Its members and
# topology are unchanged; only tier names are mapped to the submitted model.
apiVersion: topology.volcano.sh/v1alpha1
kind: HyperNode
metadata:
  name: kind-tier1-control-plane
spec:
  tier: 1
  tierName: rack
  members:
  - type: Node
    selector:
      exactMatch:
        name: kind-control-plane
---
apiVersion: topology.volcano.sh/v1alpha1
kind: HyperNode
metadata:
  name: kind-tier1-worker
spec:
  tier: 1
  tierName: rack
  members:
  - type: Node
    selector:
      exactMatch:
        name: kind-worker
---
apiVersion: topology.volcano.sh/v1alpha1
kind: HyperNode
metadata:
  name: kind-tier1-worker2
spec:
  tier: 1
  tierName: rack
  members:
  - type: Node
    selector:
      exactMatch:
        name: kind-worker2
---
apiVersion: topology.volcano.sh/v1alpha1
kind: HyperNode
metadata:
  name: kind-tier1-worker3
spec:
  tier: 1
  tierName: rack
  members:
  - type: Node
    selector:
      exactMatch:
        name: kind-worker3
---
apiVersion: topology.volcano.sh/v1alpha1
kind: HyperNode
metadata:
  name: kind-tier2-pair-a
spec:
  tier: 2
  tierName: supernode
  members:
  - type: HyperNode
    selector:
      exactMatch:
        name: kind-tier1-control-plane
  - type: HyperNode
    selector:
      exactMatch:
        name: kind-tier1-worker
---
apiVersion: topology.volcano.sh/v1alpha1
kind: HyperNode
metadata:
  name: kind-tier2-pair-b
spec:
  tier: 2
  tierName: supernode
  members:
  - type: HyperNode
    selector:
      exactMatch:
        name: kind-tier1-worker2
  - type: HyperNode
    selector:
      exactMatch:
        name: kind-tier1-worker3
---
apiVersion: topology.volcano.sh/v1alpha1
kind: HyperNode
metadata:
  name: kind-tier3-all
spec:
  tier: 3
  tierName: fabric
  members:
  - type: HyperNode
    selector:
      exactMatch:
        name: kind-tier2-pair-a
  - type: HyperNode
    selector:
      exactMatch:
        name: kind-tier2-pair-b
