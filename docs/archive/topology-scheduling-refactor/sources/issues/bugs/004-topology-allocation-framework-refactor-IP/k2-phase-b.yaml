apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug004-k2-b
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bug004-k2-b
  template:
    metadata:
      labels:
        app: bug004-k2-b
        bug004-case: k2
        shard: b
      annotations:
        scheduling.k8s.io/group-name: bug004-k2-incremental-soft
    spec:
      schedulerName: volcano
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
