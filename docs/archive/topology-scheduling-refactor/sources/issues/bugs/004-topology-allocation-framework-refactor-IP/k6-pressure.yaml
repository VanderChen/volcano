apiVersion: apps/v1
kind: Deployment
metadata: {name: bug004-k6-pressure-control-plane, namespace: default}
spec:
  replicas: 1
  selector:
    matchLabels: {app: bug004-k6-pressure-control-plane}
  template:
    metadata:
      labels: {app: bug004-k6-pressure-control-plane}
    spec:
      nodeSelector: {topology.volcano.sh/tier1: kind-control-plane}
      containers:
      - name: pressure
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests: {cpu: "8", memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: bug004-k6-pressure-worker, namespace: default}
spec:
  replicas: 1
  selector:
    matchLabels: {app: bug004-k6-pressure-worker}
  template:
    metadata:
      labels: {app: bug004-k6-pressure-worker}
    spec:
      nodeSelector: {topology.volcano.sh/tier1: kind-worker}
      containers:
      - name: pressure
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests: {cpu: "8", memory: 64Mi}
