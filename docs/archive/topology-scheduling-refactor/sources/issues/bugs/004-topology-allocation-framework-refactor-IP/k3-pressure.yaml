apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug004-k3-pressure
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bug004-k3-pressure
  template:
    metadata:
      labels:
        app: bug004-k3-pressure
    spec:
      nodeSelector:
        bug004/k3-pressure: "true"
      containers:
      - name: pressure
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests:
            cpu: "8"
            memory: 64Mi
