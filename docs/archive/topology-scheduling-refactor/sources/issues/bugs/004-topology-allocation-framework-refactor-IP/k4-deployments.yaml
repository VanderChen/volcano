apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug004-k4-0
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bug004-k4-0
  template:
    metadata:
      labels:
        app: bug004-k4-0
        bug004-case: k4
        shard: "0"
      annotations:
        scheduling.k8s.io/group-name: bug004-k4-partial-progress
    spec:
      schedulerName: volcano
      nodeSelector:
        bug004/k4: "true"
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests: {cpu: 100m, memory: 64Mi}
---
