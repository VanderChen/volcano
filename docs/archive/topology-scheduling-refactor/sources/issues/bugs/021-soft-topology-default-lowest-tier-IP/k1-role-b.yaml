apiVersion: apps/v1
kind: Deployment
metadata:
  name: k1-role-b
  namespace: default
  labels:
    scenario: soft-default-k1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k1-role-b
  template:
    metadata:
      labels:
        app: k1-role-b
        scenario: soft-default-k1
        role: role-b
        shard: b0
      annotations:
        scheduling.k8s.io/group-name: pg-soft-default-k1
    spec:
      schedulerName: volcano
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 2000m
            memory: 100Mi
          limits:
            cpu: 2000m
            memory: 100Mi
