apiVersion: v1
kind: Pod
metadata:
  name: k2-filler-hn-b
  namespace: default
  labels:
    scenario: soft-default-k2
spec:
  nodeName: volcano-dev-021-worker2
  containers:
  - name: nginx
    image: nginx:1.27-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10500m
        memory: 50Mi
      limits:
        cpu: 10500m
        memory: 50Mi
