apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: pg-soft-default-k1
  namespace: default
spec:
  minMember: 0
  queue: default
  networkTopology:
    mode: soft
    highestTierAllowed: 1
  subGroupPolicy:
  - name: role-a
    labelSelector:
      matchLabels:
        role: role-a
    matchLabelKeys:
    - shard
    subGroupSize: 1
  - name: role-b
    labelSelector:
      matchLabels:
        role: role-b
    matchLabelKeys:
    - shard
    subGroupSize: 1
