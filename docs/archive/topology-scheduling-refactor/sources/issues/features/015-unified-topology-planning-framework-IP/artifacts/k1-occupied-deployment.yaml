apiVersion: apps/v1
kind: Deployment
metadata:
  name: occupied-a
  namespace: feature-015
spec:
  replicas: 1
  selector:
    matchLabels:
      app: occupied-a
  template:
    metadata:
      labels:
        app: occupied-a
      annotations:
        scheduling.k8s.io/group-name: occupied-a
    spec:
      schedulerName: volcano
      nodeSelector:
        kubernetes.io/hostname: volcano-dev-015-nolegacy-worker
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 100m
              memory: 16Mi
