apiVersion: apps/v1
kind: Deployment
metadata:
  name: exact-bc
  namespace: feature-015
spec:
  replicas: 4
  selector:
    matchLabels:
      app: exact-bc
  template:
    metadata:
      labels:
        app: exact-bc
        feature-015.volcano.sh/role: worker
      annotations:
        scheduling.k8s.io/group-name: exact-bc
    spec:
      schedulerName: volcano
      nodeSelector:
        feature-015.volcano.sh/target: "true"
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "5"
              memory: 32Mi
