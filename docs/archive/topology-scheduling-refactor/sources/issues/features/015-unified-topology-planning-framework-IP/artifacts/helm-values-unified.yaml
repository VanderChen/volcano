basic:
  image_tag_version: dev-015-nolegacy
  image_pull_policy: IfNotPresent

custom:
  scheduler_log_level: 4
  scheduler_config_override: |
    actions: "enqueue, allocate, backfill"
    tiers:
    - plugins:
      - name: priority
      - name: gang
        enablePreemptable: false
      - name: conformance
    - plugins:
      - name: overcommit
      - name: drf
        enablePreemptable: false
      - name: predicates
      - name: proportion
      - name: nodeorder
      - name: binpack
      - name: network-topology-aware
      - name: group-topology-affinity
      - name: task-topology
