apiVersion: apps/v1
kind: Deployment
metadata:
  name: subgroup-prefill
  namespace: feature-015
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subgroup-prefill
  template:
    metadata:
      labels:
        app: subgroup-prefill
        feature-015.volcano.sh/role: prefill
      annotations:
        scheduling.k8s.io/group-name: subgroup-affinity
    spec:
      schedulerName: volcano
      nodeSelector:
        feature-015.volcano.sh/target: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - volcano-dev-015-nolegacy-worker2
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1"
              memory: 32Mi
