apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordinary
  namespace: feature-015
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ordinary
  template:
    metadata:
      labels:
        app: ordinary
      annotations:
        scheduling.k8s.io/group-name: ordinary
    spec:
      schedulerName: volcano
      nodeSelector:
        feature-015.volcano.sh/target: "true"
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 100m
              memory: 16Mi
