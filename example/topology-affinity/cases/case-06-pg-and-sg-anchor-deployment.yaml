# Create this after case-06-pg-and-sg-podgroups.yaml, and wait until it is Running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-deploy-pg-sg-anchor
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ta-deploy-pg-sg-anchor
  template:
    metadata:
      labels:
        app: ta-deploy-pg-sg-anchor
      annotations:
        scheduling.k8s.io/group-name: ta-deploy-pg-sg-anchor
    spec:
      schedulerName: volcano
      nodeSelector:
        topology.volcano.sh/tier2: kind-pair-a
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
