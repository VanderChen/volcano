# Create this after case-03-sg-hard-podgroup.yaml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-deploy-sg-hard-prefill-0
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ta-deploy-sg-hard-prefill-0
  template:
    metadata:
      labels:
        app: ta-deploy-sg-hard-prefill-0
        role: prefill
        shard: p0
      annotations:
        scheduling.k8s.io/group-name: ta-deploy-sg-hard
    spec:
      schedulerName: volcano
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
