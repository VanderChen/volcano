# Create this after ta-deploy-pg-sg-anchor is Running.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-deploy-pg-sg-combo-prefill
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ta-deploy-pg-sg-combo-prefill
  template:
    metadata:
      labels:
        app: ta-deploy-pg-sg-combo-prefill
        role: prefill
        shard: p0
      annotations:
        scheduling.k8s.io/group-name: ta-deploy-pg-sg-combo
    spec:
      schedulerName: volcano
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-deploy-pg-sg-combo-decode
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ta-deploy-pg-sg-combo-decode
  template:
    metadata:
      labels:
        app: ta-deploy-pg-sg-combo-decode
        role: decode
        shard: d0
      annotations:
        scheduling.k8s.io/group-name: ta-deploy-pg-sg-combo
    spec:
      schedulerName: volcano
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
