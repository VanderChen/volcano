# Create this after ta-deploy-pg-hard-a is Running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-deploy-pg-hard-b
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ta-deploy-pg-hard-b
  template:
    metadata:
      labels:
        app: ta-deploy-pg-hard-b
      annotations:
        scheduling.k8s.io/group-name: ta-deploy-pg-hard-b
    spec:
      schedulerName: volcano
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 360000"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
